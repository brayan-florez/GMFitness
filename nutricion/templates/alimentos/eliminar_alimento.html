<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar alimento | GMFitness</title>
</head>
<body>

    <h1>Eliminar alimento</h1>

    <p>
        ¿Estás seguro de que deseas eliminar el alimento
        <strong>{{ alimento.nombre }}</strong>?
    </p>
    <p>
        El alimento no se podrá eliminar si está incluido en una comida,
        para conservar sus registros relacionados.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
        <a href="{% url 'listar_alimentos' %}">Cancelar</a>
    </form>

</body>
</html>
