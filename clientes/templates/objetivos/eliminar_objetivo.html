<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar objetivo | GMFitness</title>
</head>
<body>

    <h1>Eliminar objetivo</h1>

    <p>
        ¿Estás seguro de que deseas eliminar el objetivo
        <strong>{{ objetivo.nombre }}</strong>?
    </p>
    <p>
        Los clientes, rutinas o dietas relacionados conservarán sus registros,
        pero dejarán de tener este objetivo asignado.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
        <a href="{% url 'listar_objetivos' %}">Cancelar</a>
    </form>

</body>
</html>
