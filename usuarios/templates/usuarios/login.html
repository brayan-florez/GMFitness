{% extends 'base.html' %}

{% block title %}Iniciar sesión | GMFitness{% endblock %}

{% block content %}
<section class="panel" style="max-width: 520px; margin: 3rem auto;">
    <h1>Iniciar sesión</h1>
    <form method="post">
        {% csrf_token %}
        <div style="display: grid; gap: 1rem;">
            <div>
                <label for="correo">Correo electrónico</label>
                <input id="correo" name="correo" type="email" required style="width: 100%; padding: .7rem; border: 1px solid #cfd8de; border-radius: .4rem;">
            </div>
            <div>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required style="width: 100%; padding: .7rem; border: 1px solid #cfd8de; border-radius: .4rem;">
            </div>
            <button type="submit" style="width: 100%;">Ingresar</button>
        </div>
    </form>
</section>
{% endblock %}
