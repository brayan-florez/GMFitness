{% extends "base.html" %}
{% block title %}{{ title }} | GMFitness{% endblock %}
{% block content %}
<section class="panel">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{{ button }}</button>
        <a href="{{ list_url }}">Volver al listado</a>
    </form>
</section>
{% endblock %}
