{% extends "base.html" %}
{% block title %}{{ title }} | GMFitness{% endblock %}
{% block content %}
<section class="panel">
    <h1>{{ title }}</h1>
    <p>¿Confirmas la acción para <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">{{ button }}</button>
        <a href="{{ list_url }}">Cancelar</a>
    </form>
</section>
{% endblock %}
