<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar sede | GMFitness</title>
</head>
<body>

    <h1>Eliminar sede</h1>

    <p>
        ¿Estás seguro de que deseas eliminar la sede
        <strong>{{ sede.nombre }}</strong>?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit">Confirmar eliminación</button>

        <a href="{% url 'listar_sedes' %}">Cancelar</a>

    </form>

</body>
</html>
