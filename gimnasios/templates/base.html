<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}GMFitness{% endblock %}</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #17212b; background: #f3f6f8; }
        body { margin: 0; }
        header { background: #123b35; color: white; padding: 1rem max(1rem, calc((100% - 1100px)/2)); }
        header a { color: white; text-decoration: none; font-weight: 700; font-size: 1.25rem; }
        nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: .75rem; }
        nav a { color: #d6eee8; font-size: .95rem; font-weight: 500; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-top: 0; }
        a { color: #08745e; }
        .panel, table { background: white; border-radius: .5rem; }
        .panel { padding: 1.25rem; }
        table { width: 100%; border-collapse: collapse; overflow: hidden; }
        th, td { padding: .75rem; border-bottom: 1px solid #e4e9eb; text-align: left; }
        th { background: #eaf2ef; }
        button, .button { display: inline-block; border: 0; border-radius: .35rem; padding: .6rem .9rem; background: #08745e; color: white; text-decoration: none; cursor: pointer; }
        input, select, textarea { max-width: 100%; }
        .messages { padding: .7rem 1rem; background: #e4f5ed; border-radius: .35rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; }
    </style>
</head>
<body>
    <header>
        <a href="{% if user.is_authenticated %}{% url 'inicio' %}{% else %}{% url 'login' %}{% endif %}">GMFitness</a>
        <nav aria-label="Navegación principal">
            {% if user.is_authenticated %}
                <a href="{% url 'listar_sedes' %}">Sedes</a>
                <a href="{% url 'listar_objetivos' %}">Objetivos</a>
                <a href="{% url 'listar_ejercicios' %}">Ejercicios</a>
                <a href="{% url 'listar_alimentos' %}">Alimentos</a>
                <a href="{% url 'admin:index' %}">Administración</a>
                <a href="{% url 'logout' %}">Cerrar sesión</a>
            {% else %}
                <a href="{% url 'login' %}">Iniciar sesión</a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}<p class="messages" role="status">{{ message }}</p>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
