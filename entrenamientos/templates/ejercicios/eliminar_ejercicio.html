<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar ejercicio | GMFitness</title>
</head>
<body>

    <h1>Eliminar ejercicio</h1>

    <p>
        ¿Estás seguro de que deseas eliminar el ejercicio
        <strong>{{ ejercicio.nombre }}</strong>?
    </p>
    <p>
        El ejercicio no se podrá eliminar si está incluido en una rutina,
        para conservar sus registros relacionados.
    </p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
        <a href="{% url 'listar_ejercicios' %}">Cancelar</a>
    </form>

</body>
</html>
